[project]
name = "runpod-ocr"
version = "0.1.0"
description = "Unified OCR API on Runpod serverless (Flash + vLLM)"
readme = "README.md"
authors = [
    { name = "Justus K", email = "justus.k@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "runpod-flash>=1.20.0",
]

[project.scripts]
runpod-ocr = "runpod_ocr.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-root = ""
