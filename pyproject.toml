[project]
name = "runpod-ocr"
version = "0.1.0"
description = "PaddleOCR-VL service with Runpod serverless vLLM inference"
readme = "README.md"
authors = [
    { name = "Justus K", email = "justus.k@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "runpod-flash>=1.20.0",
]

[project.scripts]
runpod-ocr = "runpod_ocr.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["service"]
testpaths = ["service/tests"]
