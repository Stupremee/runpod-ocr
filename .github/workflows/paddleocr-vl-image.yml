# Tests the PaddleOCR-VL service and publishes its image to GHCR.
# Tags: `main` (moving; hosts track it for auto-updates) and `sha-<commit>` (pinnable).
name: paddleocr-vl image

on:
  push:
    branches: [main]
    paths:
      - services/paddleocr-vl/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/paddleocr-vl-image.yml
  pull_request:
    paths:
      - services/paddleocr-vl/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/paddleocr-vl-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/stupremee/paddleocr-vl

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=paddleocr-vl
            org.opencontainers.image.description=PaddleOCR-VL 1.6 service: official PaddleX pipeline, async jobs, webhooks
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: services/paddleocr-vl
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
